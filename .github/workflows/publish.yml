name: CD Pipeline - Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify tag version matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          echo "Git tag: $GITHUB_REF_NAME (parsed version: $TAG_VERSION)"
          echo "package.json version: $PKG_VERSION"
          
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)!"
            exit 1
          fi
          
          echo "Version match verified successfully!"

      - name: Ensure latest npm CLI
        run: npm install -g npm@latest

      - name: Diagnostic - npm version and OIDC environment
        run: |
          echo "npm version:"
          npm --version
          echo "node version:"
          node --version
          echo "Checking for OIDC environment variables (names only, not values):"
          env | grep -i "ACTIONS_ID_TOKEN" | sed 's/=.*/=<present>/' || echo "NO ACTIONS_ID_TOKEN variables found"
          echo "npm config registry:"
          npm config get registry
          echo "Checking .npmrc content (if any):"
          cat .npmrc 2>/dev/null || echo "No .npmrc file found"

      - name: Publish to npm
        run: npm publish --access=public
