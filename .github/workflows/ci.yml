name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Create npm package tarball
        run: npm pack

      - name: Install contextforge globally from tarball
        run: npm install -g ./contextforge-*.tgz

      - name: Run CLI smoke test and doctor verification
        run: |
          set -e
          contextforge --version
          
          # Create temporary directory for isolated smoke test
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          
          # Bootstrap context and verify with doctor
          contextforge --boot ci-smoke-test -y
          cd ci-smoke-test
          contextforge doctor
